[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masuq"
version = "0.1.0"
description = "MAS-UQ pilot: loaders, step typing, judge harness, calibration, attribution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
judge = [
    "torch>=2.1",
    "transformers>=4.40",
]
openai = [
    "openai>=1.30",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
masuq = "masuq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
