[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masattr"
version = "0.2.0"
description = "MAS-Attribution harness: Who&When loaders, step typing, judge field, calibration, attribution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
judge = [
    "torch>=2.1",
    "transformers>=4.40",
]
openai = [
    "openai>=1.30",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
masattr = "masattr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
masattr = ["specs/*.txt", "specs/*.json", "calib/frozen/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
